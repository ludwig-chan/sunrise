<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64">
  <!-- 稀有鱼 - 橙红色热带鱼 -->
  <!-- 尾巴 -->
  <rect x="2" y="11" width="3" height="4" fill="#e86820"/>
  <rect x="2" y="18" width="3" height="4" fill="#e86820"/>
  <rect x="3" y="10" width="3" height="2" fill="#f87830"/>
  <rect x="3" y="21" width="3" height="2" fill="#f87830"/>
  <rect x="4" y="13" width="3" height="6" fill="#f07828"/>
  <!-- 鱼身 -->
  <rect x="6" y="10" width="18" height="12" fill="#f07028"/>
  <rect x="7" y="9" width="16" height="14" fill="#f87830"/>
  <!-- 花纹条纹 -->
  <rect x="10" y="10" width="2" height="12" fill="#c85018"/>
  <rect x="16" y="10" width="2" height="12" fill="#c85018"/>
  <rect x="22" y="11" width="2" height="10" fill="#c85018"/>
  <!-- 高光 -->
  <rect x="8" y="11" width="4" height="3" fill="#ffa060"/>
  <rect x="9" y="12" width="2" height="2" fill="#ffb878"/>
  <!-- 肚皮 -->
  <rect x="8" y="19" width="12" height="2" fill="#ffe8c8"/>
  <!-- 鳍 -->
  <rect x="12" y="7" width="8" height="4" fill="#e06018"/>
  <rect x="13" y="6" width="6" height="2" fill="#d05010"/>
  <!-- 眼睛 -->
  <rect x="22" y="12" width="3" height="3" fill="#ffffff"/>
  <rect x="23" y="13" width="2" height="2" fill="#ff4000"/>
  <rect x="23" y="13" width="1" height="1" fill="#800000"/>
  <!-- 嘴巴 -->
  <rect x="25" y="15" width="2" height="1" fill="#c05010"/>
</svg>
