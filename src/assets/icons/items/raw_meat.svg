<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64">
  <!-- 生肉 - 红粉色肉块带骨 -->
  <!-- 骨头柄 -->
  <rect x="22" y="5" width="5" height="3" fill="#e8dcc8"/>
  <rect x="23" y="4" width="3" height="5" fill="#f0e8d8"/>
  <rect x="24" y="3" width="1" height="7" fill="#ffffff"/>
  <rect x="22" y="8" width="5" height="3" fill="#e8dcc8"/>
  <rect x="20" y="10" width="4" height="2" fill="#d8cbb8"/>
  <!-- 肉块主体 -->
  <rect x="5" y="12" width="18" height="12" fill="#e05060"/>
  <rect x="4" y="13" width="20" height="10" fill="#e85868"/>
  <!-- 肉色纹理 -->
  <rect x="5" y="14" width="8" height="4" fill="#f07080"/>
  <rect x="6" y="15" width="5" height="2" fill="#f88090"/>
  <rect x="7" y="16" width="3" height="1" fill="#ffa0b0"/>
  <!-- 白色脂肪 -->
  <rect x="10" y="14" width="4" height="3" fill="#f8f0e8"/>
  <rect x="14" y="17" width="5" height="3" fill="#f0e8e0"/>
  <!-- 阴影 -->
  <rect x="15" y="21" width="8" height="3" fill="#c04050"/>
  <rect x="5" y="22" width="15" height="2" fill="#d04858"/>
  <rect x="4" y="23" width="20" height="1" fill="#b83848"/>
</svg>
