<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64">
  <!-- 水晶 - 紫色透明六棱柱 -->
  <!-- 主体 -->
  <rect x="12" y="8" width="8" height="16" fill="#9060d0"/>
  <rect x="11" y="9" width="10" height="14" fill="#a070e0"/>
  <!-- 尖端 -->
  <rect x="14" y="5" width="4" height="4" fill="#b080f0"/>
  <rect x="15" y="3" width="2" height="3" fill="#c090ff"/>
  <rect x="16" y="2" width="1" height="2" fill="#d0a0ff"/>
  <!-- 底端 -->
  <rect x="14" y="22" width="4" height="3" fill="#8050c0"/>
  <rect x="15" y="25" width="2" height="2" fill="#7040b0"/>
  <!-- 高光面 -->
  <rect x="12" y="9" width="3" height="12" fill="#c0a0f8"/>
  <rect x="12" y="10" width="2" height="10" fill="#d8c0ff"/>
  <rect x="12" y="11" width="1" height="8" fill="#e8d8ff"/>
  <!-- 反光 -->
  <rect x="14" y="6" width="2" height="3" fill="#e0d0ff"/>
  <!-- 阴影面 -->
  <rect x="18" y="9" width="3" height="12" fill="#7840b8"/>
</svg>
