<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64">
  <!-- 熟肉 - 棕色烤肉块带骨 -->
  <!-- 骨头柄 -->
  <rect x="22" y="4" width="5" height="3" fill="#e8dcc8"/>
  <rect x="23" y="3" width="3" height="5" fill="#f0e8d8"/>
  <rect x="24" y="2" width="1" height="7" fill="#ffffff"/>
  <rect x="22" y="7" width="5" height="3" fill="#e8dcc8"/>
  <rect x="20" y="9" width="4" height="2" fill="#d8cbb8"/>
  <!-- 熟肉主体 - 棕色焦香 -->
  <rect x="4" y="13" width="19" height="12" fill="#8a4820"/>
  <rect x="5" y="12" width="17" height="13" fill="#9a5228"/>
  <!-- 烤纹（焦痕） -->
  <rect x="6" y="15" width="14" height="2" fill="#6a3010"/>
  <rect x="6" y="20" width="14" height="2" fill="#6a3010"/>
  <!-- 焦香色泽 -->
  <rect x="6" y="14" width="8" height="3" fill="#b06030"/>
  <rect x="7" y="15" width="5" height="2" fill="#c07038"/>
  <!-- 油亮高光 -->
  <rect x="7" y="13" width="4" height="2" fill="#d08848"/>
  <rect x="8" y="14" width="2" height="1" fill="#e09858"/>
  <!-- 阴影 -->
  <rect x="16" y="22" width="7" height="2" fill="#6a3010"/>
  <rect x="5" y="24" width="18" height="1" fill="#5a2808"/>
</svg>
