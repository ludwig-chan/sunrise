<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64">
  <!-- 鱼 - 蓝绿色 -->
  <!-- 尾巴 -->
  <rect x="2" y="12" width="3" height="3" fill="#3a8aaa"/>
  <rect x="2" y="18" width="3" height="3" fill="#3a8aaa"/>
  <rect x="3" y="11" width="3" height="2" fill="#4a9aba"/>
  <rect x="3" y="20" width="3" height="2" fill="#4a9aba"/>
  <rect x="4" y="14" width="3" height="5" fill="#4a9aba"/>
  <!-- 鱼身 -->
  <rect x="6" y="11" width="18" height="11" fill="#4a9aba"/>
  <rect x="7" y="10" width="16" height="13" fill="#5aaaca"/>
  <rect x="8" y="9" width="14" height="15" fill="#5aaaca"/>
  <!-- 高光 -->
  <rect x="9" y="11" width="6" height="3" fill="#8adce8"/>
  <rect x="10" y="12" width="4" height="2" fill="#aaeef8"/>
  <!-- 肚皮 -->
  <rect x="8" y="20" width="14" height="2" fill="#e8f8ff"/>
  <rect x="9" y="19" width="12" height="2" fill="#d8f0fa"/>
  <!-- 鳍 -->
  <rect x="12" y="8" width="8" height="3" fill="#3a8aaa"/>
  <rect x="13" y="7" width="6" height="2" fill="#2a7a9a"/>
  <!-- 眼睛 -->
  <rect x="22" y="13" width="3" height="3" fill="#ffffff"/>
  <rect x="23" y="14" width="2" height="2" fill="#1a3a5a"/>
  <rect x="23" y="14" width="1" height="1" fill="#000000"/>
  <rect x="22" y="13" width="1" height="1" fill="#ffffff"/>
  <!-- 嘴巴 -->
  <rect x="25" y="16" width="2" height="1" fill="#2a5a7a"/>
</svg>
