<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64">
  <!-- 火把 - 带火焰的棍棒 -->
  <!-- 木柄 -->
  <rect x="14" y="18" width="4" height="12" fill="#8a5028"/>
  <rect x="15" y="17" width="2" height="14" fill="#9a5a30"/>
  <!-- 布缠绕 -->
  <rect x="13" y="15" width="6" height="4" fill="#8a4020"/>
  <rect x="14" y="14" width="4" height="5" fill="#9a4a28"/>
  <!-- 火焰内部 -->
  <rect x="14" y="6" width="4" height="9" fill="#f8c030"/>
  <rect x="13" y="8" width="6" height="7" fill="#f8a020"/>
  <rect x="12" y="10" width="8" height="5" fill="#e87810"/>
  <!-- 火焰外部 -->
  <rect x="14" y="4" width="4" height="5" fill="#ffd860"/>
  <rect x="13" y="5" width="6" height="4" fill="#ffe070"/>
  <rect x="15" y="3" width="2" height="4" fill="#fff090"/>
  <!-- 火焰右舌 -->
  <rect x="18" y="7" width="3" height="4" fill="#f8a020"/>
  <rect x="19" y="6" width="2" height="3" fill="#ffd060"/>
  <!-- 火焰左舌 -->
  <rect x="11" y="8" width="3" height="4" fill="#f8a020"/>
  <rect x="11" y="7" width="2" height="3" fill="#ffd060"/>
  <!-- 顶部 -->
  <rect x="15" y="2" width="2" height="2" fill="#ffffff"/>
</svg>
