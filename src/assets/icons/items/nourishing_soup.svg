  <rect x="21" y="9" width="2" height="5" fill="#d0d0e0"/>
  <rect x="20" y="7" width="2" height="3" fill="#e0e0f0"/>
  <!-- 肉片点缀 -->
  <rect x="10" y="16" width="4" height="3" fill="#c86030"/>
  <rect x="18" y="17" width="4" height="3" fill="#c86030"/>
