  <rect x="9" y="25" width="14" height="2" fill="#9a5a30"/>
  <rect x="11" y="27" width="10" height="1" fill="#7a4520"/>
  <!-- 碗壁 -->
  <rect x="5" y="16" width="22" height="10" fill="#9a5a30"/>
  <rect x="6" y="15" width="20" height="11" fill="#aa6438"/>
