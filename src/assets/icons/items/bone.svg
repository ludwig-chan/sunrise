  <rect x="4" y="7" width="6" height="10" fill="#f8f4e8"/>
  <rect x="3" y="9" width="8" height="6" fill="#f8f4e8"/>
  <rect x="4" y="8" width="2" height="2" fill="#ffffff"/>
  <!-- 右端圆球 -->
  <rect x="21" y="16" width="8" height="8" fill="#f0ece0"/>
  <rect x="22" y="15" width="6" height="10" fill="#f8f4e8"/>
  <rect x="21" y="17" width="8" height="6" fill="#f8f4e8"/>
