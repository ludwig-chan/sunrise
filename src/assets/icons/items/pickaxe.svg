<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64">
  <!-- 石镐 - 尖头采矿镐 -->
  <!-- 木柄 -->
  <rect x="14" y="18" width="3" height="12" fill="#8a5028"/>
  <rect x="15" y="17" width="2" height="13" fill="#9a5a30"/>
  <!-- 镐头 -->
  <rect x="4" y="10" width="24" height="4" fill="#9a9a9a"/>
  <rect x="4" y="8" width="24" height="6" fill="#8a8a8a"/>
  <!-- 左尖（采矿端） -->
  <rect x="2" y="9" width="4" height="2" fill="#b0b0b0"/>
  <rect x="1" y="10" width="4" height="2" fill="#c0c0c0"/>
  <rect x="2" y="11" width="3" height="2" fill="#b0b0b0"/>
  <!-- 右尖 -->
  <rect x="26" y="9" width="4" height="2" fill="#b0b0b0"/>
  <rect x="27" y="10" width="4" height="2" fill="#c0c0c0"/>
  <rect x="27" y="11" width="3" height="2" fill="#b0b0b0"/>
  <!-- 高光 -->
  <rect x="6" y="9" width="8" height="2" fill="#c8c8c8"/>
  <!-- 阴影 -->
  <rect x="4" y="12" width="24" height="2" fill="#787878"/>
  <!-- 连接点 -->
  <rect x="13" y="12" width="6" height="6" fill="#7a4520"/>
</svg>
