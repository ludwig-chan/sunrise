<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64">
  <!-- 石斧 - 灰色斧头 + 棕色木柄 -->
  <!-- 木柄 -->
  <rect x="18" y="16" width="3" height="14" fill="#8a5028"/>
  <rect x="19" y="15" width="2" height="16" fill="#9a5a30"/>
  <rect x="19" y="16" width="1" height="14" fill="#aa6438"/>
  <!-- 斧头 -->
  <rect x="8" y="5" width="12" height="4" fill="#8a8a8a"/>
  <rect x="6" y="7" width="14" height="6" fill="#9a9a9a"/>
  <rect x="5" y="9" width="14" height="8" fill="#9a9a9a"/>
  <rect x="6" y="17" width="14" height="3" fill="#8a8a8a"/>
  <rect x="8" y="20" width="12" height="2" fill="#787878"/>
  <!-- 斧刃 -->
  <rect x="4" y="8" width="3" height="12" fill="#b0b0b0"/>
  <rect x="3" y="9" width="3" height="10" fill="#c0c0c0"/>
  <rect x="2" y="11" width="3" height="6" fill="#d0d0d0"/>
  <!-- 高光 -->
  <rect x="7" y="8" width="5" height="3" fill="#c0c0c0"/>
  <rect x="8" y="9" width="3" height="2" fill="#d8d8d8"/>
  <!-- 阴影 -->
  <rect x="15" y="16" width="5" height="4" fill="#686868"/>
</svg>
