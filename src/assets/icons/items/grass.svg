<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64">
  <!-- 干草束 - 黄褐色枯草 -->
  <!-- 地面/阴影 -->
  <ellipse cx="16" cy="28" rx="10" ry="2" fill="#c8a050" opacity="0.3"/>
  <!-- 草束主体（稻草堆，底部较宽） -->
  <!-- 左侧草茎 -->
  <line x1="8" y1="27" x2="6" y2="8" stroke="#c8922a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="27" x2="9" y2="6" stroke="#d4a030" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 左中草茎 -->
  <line x1="12" y1="27" x2="11" y2="5" stroke="#c8922a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="13" y1="27" x2="13" y2="4" stroke="#ddb040" stroke-width="2" stroke-linecap="round"/>
  <!-- 中央草茎（最高） -->
  <line x1="15" y1="27" x2="14" y2="3" stroke="#c8922a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="17" y1="27" x2="17" y2="3" stroke="#d4a030" stroke-width="2" stroke-linecap="round"/>
  <!-- 右中草茎 -->
  <line x1="19" y1="27" x2="19" y2="4" stroke="#ddb040" stroke-width="2" stroke-linecap="round"/>
  <line x1="21" y1="27" x2="21" y2="5" stroke="#c8922a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 右侧草茎 -->
  <line x1="23" y1="27" x2="23" y2="7" stroke="#d4a030" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="27" x2="26" y2="9" stroke="#c8922a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 捆扎绳索（中间横线，深棕色） -->
  <rect x="7" y="18" width="18" height="3" rx="1.5" fill="#8B5E3C"/>
  <!-- 绳结 -->
  <circle cx="16" cy="19.5" r="2.5" fill="#7a4e2e"/>
  <rect x="14.5" y="17.5" width="3" height="4" rx="1" fill="#6b3f22"/>
</svg>
